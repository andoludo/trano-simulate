[project]
name = "trano-simulate"
version = "0.1.0"
description = "Simulate Modelica models with OpenModelica (in Docker or locally) and report their results."
authors = [{ name = "Ando Andriamamonjy", email = "andoludovic.andriamamonjy@gmail.com" }]
requires-python = ">=3.11,<4.0"
readme = "README.md"
license = {text = "LGPL-3.0-or-later"}
keywords = ["modelica", "openmodelica", "simulation", "building energy simulation"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python",
    "Typing :: Typed",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "pydantic>=2.13.4,<3",
    "docker>=7.1.0,<8",
    "jinja2>=3.1.6,<4",
    "pandas>=2.2.2,<3",
    "buildingspy>=5.2.0,<6",
    "matplotlib>=3.10.9,<4",
    "plotly>=6.8.0,<7",
    "python-docx>=1.2.0,<2",
    "yattag>=1.16.1,<2",
]

[project.urls]
Repository = "https://github.com/andoludo/trano-simulate"

[project.scripts]
trano-install-libraries = "trano_simulate.install_libraries:main"

[dependency-groups]
dev = [
    "mypy>=2.1.0,<3",
    "ruff>=0.15.16,<0.16",
    "pandas-stubs>=2.2.0.240218,<3",
    "pytest>=9.0.3,<10",
]

[tool.uv]
default-groups = "all"

[tool.uv.build-backend]
module-root = ""
source-include = ["LICENSE"]

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "simulate: integration tests that require Docker and the OpenModelica image",
    "simulation: simulations with the local runtime, which need OpenModelica's omc on the PATH",
]
addopts = "-ra"

[tool.mypy]
plugins = "pydantic.mypy"
packages = ["trano_simulate"]
follow_imports = "silent"
warn_redundant_casts = true
warn_unused_ignores = true
disallow_any_generics = true
check_untyped_defs = true
no_implicit_reexport = true
show_absolute_path = true
disallow_untyped_defs = true
strict = true
exclude = ["test_*", "conftest.py"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "W", "F", "B006","RUF","UP","SIM","FURB","PIE","PERF","C4","B","PL","S","C901","N","ANN", "ERA001", "PD"]
ignore = ["UP006", "UP035"]
# UP042 (StrEnum) as in trano; PLC0415 for the imports kept inside functions.
extend-ignore = ["S101","PLR2004","W291","UP042","PLC0415"]
fixable = ["ALL"]
unfixable = []
